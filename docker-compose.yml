services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: almox
      POSTGRES_USER: almox
      POSTGRES_PASSWORD: almox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almox -d almox"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://almox:almox@db:5432/almox
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-por-um-bem-longo}
      CORS_ORIGIN: http://localhost:8080
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
